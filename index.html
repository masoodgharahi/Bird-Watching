<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پرندگان ایران</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c5e3b">
    
    <!-- Cropper.js CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🦅 پرندگان ایران</h1>
            <div class="header-buttons">
                <button id="add-bird-btn" class="icon-btn" title="افزودن پرنده جدید">➕</button>
                <button id="all-sightings-btn" class="icon-btn" title="مشاهدات من">📋</button>
            </div>
        </div>
        <input type="text" id="search-input" placeholder="جستجوی پرنده...">
    </header>

    <main id="bird-list-container">
        <div id="bird-list"></div>
    </main>

    <!-- Bird Detail Modal -->
    <div id="bird-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('bird-modal')">&times;</span>
            <img id="modal-img" src="" alt="">
            <h2 id="modal-name"></h2>
            <p id="modal-sci-name" class="sci-name"></p>
            <div id="modal-desc" class="description"></div>
            
            <button id="log-sighting-btn" class="primary-btn">ثبت مشاهده جدید 📝</button>
            
            <h3>مشاهدات قبلی من</h3>
            <div id="sighting-history"></div>
        </div>
    </div>

    <!-- Log/Edit Sighting Modal -->
    <div id="log-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('log-modal')">&times;</span>
            <h2 id="log-modal-title">ثبت مشاهده</h2>
            <form id="sighting-form">
                <label>تاریخ (اختیاری):</label>
                <input type="date" id="sighting-date">
                
                <label>توضیحات:</label>
                <textarea id="sighting-notes" placeholder="مثلاً: در حال خوردن دانه روی درخت بلوط..."></textarea>
                
                <label>افزودن عکس (از گالری یا دوربین):</label>
                <input type="file" id="sighting-photo" accept="image/*" multiple>
                <div id="photo-preview"></div>
                
                <button type="submit" class="primary-btn" id="submit-btn">ذخیره مشاهده (آفلاین)</button>
            </form>
        </div>
    </div>

    <!-- Add New Bird Modal -->
    <div id="add-bird-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('add-bird-modal')">&times;</span>
            <h2>➕ افزودن پرنده جدید</h2>
            <p style="color:#666; font-size:0.85rem; margin-bottom:15px;">اگر پرنده‌ای که مشاهده کرده‌اید در لیست نیست، می‌توانید آن را اضافه کنید.</p>
            <form id="add-bird-form">
                <label>نام فارسی: *</label>
                <input type="text" id="new-bird-name-fa" required placeholder="مثلاً: چکاوک شاخدار">
                
                <label>نام انگلیسی:</label>
                <input type="text" id="new-bird-name-en" placeholder="مثلاً: Horned Lark">
                
                <label>نام علمی:</label>
                <input type="text" id="new-bird-sci-name" placeholder="مثلاً: Eremophila alpestris">
                
                <label>توضیحات:</label>
                <textarea id="new-bird-desc" placeholder="توضیحاتی درباره این پرنده..."></textarea>
                
                <label>عکس پرنده (اختیاری):</label>
                <input type="file" id="new-bird-photo" accept="image/*">
                <div id="new-bird-photo-preview"></div>
                
                <button type="submit" class="primary-btn">ذخیره پرنده جدید</button>
            </form>
        </div>
    </div>

    <!-- All Sightings Modal -->
    <div id="all-sightings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('all-sightings-modal')">&times;</span>
            <h2>📋 همه مشاهدات من</h2>
            
            <div id="sightings-stats" class="stats-box"></div>
            
            <div class="backup-buttons">
                <button id="export-btn" class="secondary-btn">📥 دریافت پشتیبان (Export)</button>
                <label class="secondary-btn import-label">
                    📤 بازیابی پشتیبان (Import)
                    <input type="file" id="import-file" accept=".json" style="display:none;">
                </label>
            </div>
            
            <div id="all-sightings-list"></div>
        </div>
    </div>

    <!-- ✂️ Crop Modal -->
    <div id="crop-modal" class="modal crop-modal">
        <div class="crop-container">
            <div class="crop-header">
                <button type="button" class="crop-cancel-btn" onclick="cancelCrop()">✕ انصراف</button>
                <span class="crop-title">برش تصویر</span>
                <button type="button" class="crop-confirm-btn" onclick="confirmCrop()">✓ تأیید</button>
            </div>
            <div class="crop-body">
                <img id="crop-image" src="" alt="">
            </div>
            <div class="crop-footer">
                <div class="crop-tools">
                    <button type="button" onclick="rotateCrop(-90)" title="چرخش چپ">↺</button>
                    <button type="button" onclick="rotateCrop(90)" title="چرخش راست">↻</button>
                    <button type="button" onclick="flipCrop('x')" title="آینه افقی">⇔</button>
                    <button type="button" onclick="flipCrop('y')" title="آینه عمودی">⇕</button>
                    <button type="button" onclick="resetCrop()" title="بازنشانی">⟲</button>
                </div>
                <div class="crop-ratios">
                    <button type="button" class="ratio-btn active" data-ratio="free" onclick="setAspectRatio('free')">آزاد</button>
                    <button type="button" class="ratio-btn" data-ratio="1:1" onclick="setAspectRatio('1:1')">1:1</button>
                    <button type="button" class="ratio-btn" data-ratio="4:3" onclick="setAspectRatio('4:3')">4:3</button>
                    <button type="button" class="ratio-btn" data-ratio="16:9" onclick="setAspectRatio('16:9')">16:9</button>
                    <button type="button" class="ratio-btn" data-ratio="3:4" onclick="setAspectRatio('3:4')">3:4</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
